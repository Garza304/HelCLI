name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the theme gallery
        run: python3 themes/tools/build_gallery.py --check

      - name: Unit tests
        run: ./gradlew --no-daemon testFdroidDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew --no-daemon assembleFdroidDebug assemblePlaystoreDebug

      - uses: actions/upload-artifact@v4
        with:
          name: helcli-debug-apk
          path: |
            app/build/outputs/apk/fdroid/debug/*.apk
            app/build/outputs/apk/playstore/debug/*.apk
