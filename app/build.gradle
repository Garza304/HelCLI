apply plugin: 'com.android.application'

android {
    namespace "ohi.andre.consolelauncher"
    compileSdk 34

    def keystorePropertiesFile = rootProject.file("local.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    // Release signing is only set up when a keystore is present (see local.properties).
    // Without one, debug builds use the standard Android debug key so anyone can build.
    def releaseKeystore = rootProject.file(keystoreProperties["storeFile"] ?: "release.jks")
    def hasReleaseKeystore = releaseKeystore.exists()

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile releaseKeystore
                storePassword = keystoreProperties["storePassword"] ?: ""
                keyAlias = keystoreProperties["keyAlias"] ?: "helcli"
                keyPassword = keystoreProperties["keyPassword"] ?: ""
            }
        }
    }

    defaultConfig {
        applicationId "com.garza304.helcli"
        minSdk 21
        targetSdk 34
        versionCode 400
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            if (hasReleaseKeystore) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) signingConfig signingConfigs.release
        }
    }

    productFlavors {
        flavorDimensions = ["default"]
        fdroid {
            dimension "default"
        }
        playstore {
            dimension "default"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // The theme gallery lives in /themes at the repo root. Its theme files are
    // bundled into the APK so the built-in themes work offline.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/themeGallery"]
        }
    }
}

tasks.register('copyThemeGallery', Copy) {
    from(rootProject.file('themes')) {
        include '*.json'
        exclude 'index.json'
    }
    into "$buildDir/generated/themeGallery/themes"
}
preBuild.dependsOn copyThemeGallery

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29'
    implementation 'com.jayway.jsonpath:json-path:2.9.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'it.andreuzzi:CompareString2:1.0.9'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
